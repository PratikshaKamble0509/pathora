<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

a{color:var(--ac);text-decoration:none}h1,h2,h3{margin:.2em 0;letter-spacing:-.01em}h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:700}h2{font-size:1.5rem}h3{font-size:1.05rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;align-items:center;padding:12px 20px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
nav b{font-size:1.2rem;margin-right:auto;color:var(--tx)}nav a{padding:6px 12px;border-radius:99px;color:var(--tx2);font-size:.92rem}nav a.on,nav a:hover{background:var(--blue);color:var(--tx)}
main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(36,50,75,.06),inset 0 -3px 0 rgba(36,50,75,.03)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.b2{grid-column:span 2}@media(max-width:600px){.b2{grid-column:auto}}
.btn{border:0;border-radius:14px;padding:11px 18px;font:600 .95rem Manrope,sans-serif;cursor:pointer;background:var(--ac);color:#fff;transition:.2s}.btn:hover{transform:translateY(-1px)}.btn.s{background:var(--blue);color:var(--tx)}.btn.sm{padding:6px 12px;font-size:.82rem}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 12px}label{font-size:.85rem;color:var(--tx2);font-weight:600}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;background:var(--lav);margin:2px 4px 2px 0}.chip.g{background:var(--mint)}.chip.w{background:var(--warn)}
.hero{display:grid;gap:30px;grid-template-columns:1.1fr 1fr;align-items:center;padding:30px 0}@media(max-width:800px){.hero{grid-template-columns:1fr}}
.glass{background:linear-gradient(135deg,var(--blue),var(--lav));border-radius:28px;padding:18px;border:1px solid rgba(255,255,255,.5)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}.task input{width:auto;margin:4px 0}.task.d span.t{text-decoration:line-through;color:var(--tx2)}
.t2{color:var(--tx2);font-size:.88rem}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;min-height:64px;font-size:.78rem;overflow:hidden}.cal .h{min-height:0;background:none;border:0;text-align:center;color:var(--tx2)}
.scroll{overflow-x:auto}details{border-bottom:1px solid var(--bd);padding:10px 0}summary{cursor:pointer;font-weight:600}
.day{border:1px solid var(--bd);border-radius:16px;padding:6px 14px;margin:10px 0;background:var(--card)}.day.today{border-color:var(--ac);background:var(--blue)}.day summary{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 0}.crumb{font-size:.85rem;color:var(--tx2);margin-bottom:10px}#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:9;max-width:90vw}nav{flex-wrap:nowrap;overflow-x:auto}nav a{white-space:nowrap}</style></head><body><nav id="nav"></nav><main id="app"></main>
<script>
const EDU=['Class 10','Class 12','Diploma','Undergraduate','Postgraduate','Professional qualification'],RANK=[0,1,2,3,4,3],DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],INT=['Technology','Finance','Government service','Design','Teaching','Administration','Healthcare','Business','Trades & hospitality','Logistics'];
const C=[];
const $=s=>document.querySelector(s);let S={users:{},cur:null};
const save=()=>{},U=()=>S.users[S.cur];
const f=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),P=s=>new Date(s+'T00:00'),add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return f(d)},today=()=>f(new Date()),mon=s=>{const d=P(s);return add(s,-((d.getDay()+6)%7))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- scheduler ----
function buildPlan(u,c,target){const tasks=[];let i=0;for(const[ph,s]of Object.entries(c.ph))for(const it of s.split('|')){const[n,h]=it.split(':');let r=+h,k=1;const ch=Math.max(.5,Math.min(2,u.profile.hpd,u.profile.hpw)),parts=Math.ceil(r/ch);while(r>0){const x=Math.min(ch,r);tasks.push({id:'t'+i++,t:parts>1?`${n} — part ${k}/${parts}`:n,h:x,phase:ph,topic:n,done:false,spent:0,note:''});r-=x;k++}}
place(tasks,today(),{},{},u,u.leaves);return tasks}
function feas(u){const g=u.goal,end=g.tasks.reduce((m,t)=>t.date>m?t.date:m,'');let days=0;for(let d=today();d<=g.target;d=add(d,1))if(!blocked(u,d,u.leaves))days++;const tot=g.tasks.reduce((s,t)=>s+t.h,0),rem=g.tasks.filter(t=>!t.done).reduce((s,t)=>s+t.h,0);return{end,days,tot,rem,ok:end<=g.target,need:days?Math.ceil(rem/days*10)/10:rem}}
// ---- render ----
let V={view:'day',pend:null,q:'',sec:'',elig:false,ob:0,obd:{}};
function home(){return`<section class="hero"><div><span class="chip g">Career discovery & preparation planning</span><h1>Your Future Has a Path. Let's Find Yours.</h1><p class="t2" style="font-size:1.1rem">Tell Pathora about your education, explore careers you may be eligible for, pick a target date and get a study timetable that adapts when life gets in the way. No outcome is guaranteed — Pathora helps you plan.</p><div class="row"><a class="btn" href="#/auth">Discover My Career Path</a><a class="btn s" href="#/explore">Explore Career Options</a></div></div>
<div class="glass"><div class="card" style="margin-bottom:12px"><h3>Sample dashboard</h3><div class="t2">Goal: Bank PO · 62% roadmap</div><div class="bar"><i style="width:62%"></i></div></div><div class="card"><h3>Sample week</h3><div class="row t2"><span class="chip">Mon Quant 2h</span><span class="chip g">Tue Reasoning 2h</span><span class="chip">Wed Rest</span><span class="chip g">Thu English 2h</span></div></div></div></section>
<h2>How it works</h2><div class="grid">${['Enter background','Explore careers','Set a deadline','Follow your timetable','Reschedule after leave'].map((x,i)=>`<div class="card" style="background:var(--${['blue','lav','mint','blue','lav'][i]})"><b>${i+1}. ${x}</b></div>`).join('')}</div>
<h2 style="margin-top:36px">Features</h2><div class="grid"><div class="card b2"><h3>Eligibility-aware explorer</h3><p class="t2">See missing prerequisites and what needs verification — never a blanket promise.</p></div><div class="card"><h3>Realistic roadmaps</h3><p class="t2">Phases, tasks and hour estimates checked against your target date.</p></div><div class="card"><h3>Smart leave handling</h3><p class="t2">Preview, confirm or cancel schedule changes, with full history.</p></div></div>
<h2 style="margin-top:36px">For students and job seekers</h2><p class="t2">School leavers compare degree and exam routes; graduates find exams and skills pathways; career changers see what to learn first.</p>
<h2 style="margin-top:36px">FAQ</h2><details><summary>Is the career data official?</summary><p class="t2">It is a starter sample. Every record links to an official source and must be verified there.</p></details><details><summary>Where is my data stored?</summary><p class="t2">In this browser only (see Profile). This build has no server.</p></details><details><summary>Does a plan guarantee success?</summary><p class="t2">No. It is a planning aid.</p></details>
<footer class="t2" style="margin-top:40px">© Pathora · <a href="#/explore">Explore</a> · <a href="#/auth">Log in</a></footer>`}
function auth(){return`<div class="card" style="max-width:420px;margin:auto"><h2>Welcome to Pathora</h2><label>Email</label><input id="em" type="email" autocomplete="email"><label>Password (min 6)</label><input id="pw" type="password"><div class="row"><button class="btn" onclick="login(1)">Create account</button><button class="btn s" onclick="login(0)">Log in</button></div><p class="t2" id="er"></p><p class="t2">Demo auth: accounts live in this browser only and are not securely hashed.</p></div>`}
function onboard(){const u=U(),d=V.obd,s=V.ob,p=u.profile||{};const st=[()=>`<label>Education level</label><select id="edu">${EDU.map((x,i)=>`<option value="${i}" ${(d.edu??p.edu)==i?'selected':''}>${x}</option>`)}</select><label>Stream / subjects</label><input id="stream" value="${esc(d.stream??p.stream??'')}"><label>Currently studying?</label><select id="cs"><option>No</option><option ${d.cs=='Yes'?'selected':''}>Yes</option></select>`,
()=>`<label>Skills & experience</label><textarea id="skills">${esc(d.skills??p.skills??'')}</textarea><label>Interests</label>${INT.map(x=>`<label><input type="checkbox" class="ci" value="${x}" style="width:auto" ${(d.int??p.int??[]).includes(x)?'checked':''}> ${x}</label>`).join(' ')}<br><br><label>Sector preference</label><select id="sec">${['Any','Government','Private'].map(x=>`<option ${(d.sec??p.sec)==x?'selected':''}>${x}</option>`)}</select><label>What do you want?</label><select id="intent">${[['job','A job'],['exam','A competitive exam route'],['edu','Further education'],['voc','Vocational training']].map(([v,l])=>`<option value="${v}" ${(d.intent??p.intent)==v?'selected':''}>${l}</option>`)}</select><label>Work experience</label><input id="exp" value="${esc(d.exp??p.exp??'')}"><label>Location preference</label><input id="loc" value="${esc(d.loc??p.loc??'')}">`,
()=>`<label>Study hours per day</label><input id="hpd" type="number" min="0.5" max="12" step="0.5" value="${d.hpd??p.hpd??2}"><label>Daily study start time</label><input id="stt" type="time" value="${d.start??p.start??'18:00'}"><label>Study hours per week</label><input id="hpw" type="number" min="1" max="70" value="${d.hpw??p.hpw??10}"><label>Rest days</label>${DAYS.map((x,i)=>`<label><input type="checkbox" class="cr" value="${i}" style="width:auto" ${(d.rest??p.rest??[0]).includes(i)?'checked':''}> ${x}</label>`).join(' ')}`];
return`<div class="card" style="max-width:560px;margin:auto"><div class="t2">Step ${s+1} of 3</div><div class="bar"><i style="width:${(s+1)*33.3}%"></i></div><h2>${['Your education','Skills & interests','Study availability'][s]}</h2>${st[s]()}<div class="row">${s?'<button class="btn s" onclick="obGo(-1)">Back</button>':''}<button class="btn s" onclick="cancelOb()">Cancel</button><button class="btn" onclick="obGo(1)">${s==2?'Finish':'Next'}</button></div><p class="t2" id="er"></p></div>`}
function obGo(n){const d=V.obd,g=i=>$('#'+i);V.dirty=true;if(V.ob==0){d.edu=+g('edu').value;d.stream=g('stream').value;d.cs=g('cs').value}else if(V.ob==1){d.skills=g('skills').value;d.int=[...document.querySelectorAll('.ci:checked')].map(x=>x.value);d.sec=g('sec').value;d.loc=g('loc').value;d.intent=g('intent').value;d.exp=g('exp').value}else{d.hpd=+g('hpd').value;d.hpw=+g('hpw').value;d.rest=[...document.querySelectorAll('.cr:checked')].map(x=>+x.value);d.start=g('stt').value||'18:00';
if(n>0){if(!(d.hpd>0)||!(d.hpw>0)||d.hpd>d.hpw)return $('#er').textContent='Check your hours: weekly must be at least daily.';if(d.rest.length>6)return $('#er').textContent='Keep at least one study day.';const u=U();u.profile={edu:0,stream:'',cs:'No',skills:'',int:[],sec:'Any',loc:'',intent:'job',exp:'',...u.profile,...d};return api('PUT','/profile',u.profile).then(()=>{V.ob=0;V.obd={};V.dirty=false;toast('Profile saved.');location.hash=u.goal?'#/dash':'#/explore'}).catch(e=>$('#er').textContent=e.message)}}
V.ob=Math.max(0,Math.min(2,V.ob+n));route()}
function elig(c,u){if(!u||!u.profile)return null;const m=[];if(RANK[u.profile.edu]<c.min)m.push(`Requires about ${EDU[c.min]} level or higher; you are at ${EDU[u.profile.edu]}. Consider an upgrading pathway first.`);return m}
function explore(){const u=U(),q=V.q.toLowerCase();let l=C.filter(c=>(!q||(c.n+c.cat+c.d).toLowerCase().includes(q))&&(!V.sec||c.sec==V.sec)&&(!V.dom||c.domain==V.dom)&&(!V.elig||!u||!elig(c,u).length));
if(u&&u.profile)l.sort((a,b)=>b.int.filter(x=>u.profile.int.includes(x)).length-a.int.filter(x=>u.profile.int.includes(x)).length);
return`<h1 style="font-size:2rem">Career explorer</h1><p class="t2">${C.length} pathways (domain → sector → category). Sample records are unverified; check the official source.</p><div class="row"><input style="max-width:280px" placeholder="Search careers" value="${esc(V.q)}" oninput="V.q=this.value;route2(this)"><select style="max-width:200px" onchange="V.sec=this.value;route()">${['','Government','Private','Education pathway'].map(x=>`<option value="${x}" ${V.sec==x?'selected':''}>${x||'All sectors'}</option>`)}</select>${u?`<label><input type="checkbox" style="width:auto" ${V.elig?'checked':''} onchange="V.elig=this.checked;route()"> Only eligible</label>`:''}</div>
<div class="row" style="margin:8px 0"><select style="max-width:300px" onchange="V.dom=this.value;route()"><option value="">All domains</option>${[...new Set(C.map(c=>c.domain))].map(d=>`<option ${V.dom==d?'selected':''}>${esc(d)}</option>`)}</select></div><div class="grid">${l.map(c=>{const m=elig(c,u);return`<a class="card" href="#/career/${c.id}" style="color:inherit"><span class="chip g">${esc(c.domain)}</span><span class="chip">${c.sec}</span><span class="chip">${c.cat}</span><h3>${c.n}</h3><p class="t2">${c.d}</p>${m?(m.length?`<span class="chip w">Prerequisite missing</span>`:`<span class="chip g">Meets education level*</span>`):''}</a>`}).join('')||'<p>No matches.</p>'}</div>`}
function route2(el){const p=el.selectionStart;route();const i=document.querySelector('input[placeholder="Search careers"]');i.focus();i.setSelectionRange(p,p)}
function career(id){const c=C.find(x=>x.id==id),u=U();if(!c)return'<p>Not found.</p>';const m=elig(c,u),hrs=Object.values(c.ph).join('|').split('|').reduce((s,x)=>s+ +x.split(':')[1],0);
return crumb([['Explore','#/explore'],[c.n]])+`<div class="card"><span class="chip">${c.sec}</span><span class="chip">${c.cat}</span><h1 style="font-size:2rem">${c.n}</h1><p>${c.d}</p><p><b>Eligibility:</b> ${c.el} <span class="chip w">Verify officially</span></p><p><b>Selection:</b> ${c.sel}</p><p><b>Official source:</b> ${c.link?`<a href="${c.link}" target="_blank" rel="noopener">${c.link}</a>`:"none verified yet"} <span class="chip ${c.status=='verified'?'g':'w'}">${c.status}${c.verified?' · verified '+c.verified:''}</span></p>${m?m.map(x=>`<p class="chip w">${x}</p>`).join('')||'<p class="chip g">Education level looks sufficient (other criteria such as age must still be checked).</p>':'<p class="t2">Log in to check your eligibility.</p>'}
<h3>Syllabus & phases · about ${hrs} study hours</h3>${Object.entries(c.ph).map(([k,v])=>`<p><b>${k}:</b> ${v.split('|').map(x=>x.split(':')[0]+' ('+x.split(':')[1]+'h)').join(', ')}</p>`).join('')}
<h3>Learning resources</h3>${resHtml(c)}<p><button class="btn sm s" onclick="cmpAdd('${c.id}')">${V.cmp.includes(c.id)?'Remove from':'Add to'} compare</button> <a href="#/compare">View comparison (${V.cmp.length})</a></p><h3>Set target date</h3><p class="t2">A target date is a planning goal, not a guarantee of selection; outcomes depend on recruitment, eligibility and results.</p>${u?`<input type="date" id="tg" min="${add(today(),7)}" value="${add(today(),c.mo*30)}"><button class="btn" onclick="pick('${c.id}')">Generate my roadmap</button><p class="t2" id="er"></p>`:'<a class="btn" href="#/auth">Log in to plan</a>'}</div>`}
function noGoal(){return`<div class="card"><h2>No goal yet</h2><p class="t2">Pick a career to generate your roadmap.</p><a class="btn" href="#/explore">Explore careers</a></div>`}
function dash(){const u=U(),g=u.goal;if(!g)return noGoal();const c=C.find(x=>x.id==g.cid),x=feas(u),t0=today(),done=g.tasks.filter(t=>t.done),pct=Math.round(done.length/g.tasks.length*100),td=g.tasks.filter(t=>t.date==t0),up=g.tasks.filter(t=>!t.done&&t.date>t0).slice(0,5),od=g.tasks.filter(t=>!t.done&&t.date<t0),wk=g.tasks.filter(t=>mon(t.date)==mon(t0)),wd=wk.filter(t=>t.done).reduce((s,t)=>s+(t.spent||t.h),0);
const ph=Object.keys(c.ph).map(p=>{const a=g.tasks.filter(t=>t.phase==p);return{p,e:a.reduce((m,t)=>t.date>m?t.date:m,''),n:a.filter(t=>t.done).length+'/'+a.length}});const lv=u.leaves.filter(l=>l.to>=t0);
const next=od.length?'Reschedule your overdue tasks on the Leave page.':!x.ok?'Your plan overshoots the target — adjust hours or the date.':td.length?'Complete today’s tasks.':'Rest or get ahead on the next task.';
return`<h1 style="font-size:2rem">Your dashboard</h1><div class="grid"><div class="card b2" style="background:var(--blue)"><span class="chip">Goal</span><h2>${c.n}</h2><p>Target ${g.target} · projected finish ${x.end} <span class="chip ${x.ok?'g':'w'}">${x.ok?'On track':'Over target'}</span></p><div class="bar"><i style="width:${pct}%"></i></div><p class="t2">${pct}% · ${done.length}/${g.tasks.length} tasks · ${x.rem}h remaining</p></div>
<div class="card" style="background:var(--mint)"><h3>This week</h3><h2>${wd}h studied</h2><p class="t2">${wk.reduce((s,t)=>s+t.h,0)}h planned of ${u.profile.hpw}h limit</p></div>
<div class="card b2"><h3>Today (${t0})</h3>${td.map(tk).join('')||'<p class="t2">Nothing scheduled — rest day or free day.</p>'}</div>
<div class="card"><h3>Upcoming</h3>${up.map(t=>`<div class="t2">${t.date} · ${esc(t.t)}</div>`).join('')||'—'}</div>
<div class="card"><h3>Milestones</h3>${ph.map(m=>`<div class="t2">${m.p}: by ${m.e} (${m.n})</div>`).join('')}</div>
<div class="card" style="background:var(--lav)"><h3>Alerts & next action</h3>${od.length?`<p class="chip w">${od.length} overdue task(s)</p>`:''}${lv.map(l=>`<p class="chip">Leave ${l.from}→${l.to}</p>`).join('')}<p>${next}</p></div>
<div class="card"><h3>Recent schedule changes</h3>${u.hist.slice(-3).reverse().map(h=>`<div class="t2">${h.at.slice(0,10)} · ${esc(h.r)}${h.n?` (${h.n} moved)`:''}</div>`).join('')}</div>
<div class="card b2"><h3>Resources</h3>${resHtml(c)}</div></div>`}
function settings(){const u=U(),p=u.profile;return`<h1 style="font-size:2rem">Profile & settings</h1><div class="card"><p><b>${esc(S.cur)}</b></p><p class="t2">${EDU[p.edu]} · ${esc(p.stream||'no stream')} · ${p.hpd}h/day, ${p.hpw}h/week · rest: ${p.rest.map(d=>DAYS[d]).join(', ')}</p><div class="row"><button class="btn" onclick="V.ob=0;V.obd={};location.hash='#/onboard'">Edit profile</button><button class="btn s" onclick="if(confirm('Delete account and all data?')){api('DELETE','/me').then(()=>{S.cur=null;location.hash='#/';route()})}">Delete account</button></div><p class="t2">Changed hours apply to newly generated or rescheduled plans. Data is stored in this browser only; a production version needs the Express/PostgreSQL backend.</p></div>`}
// ===== v2: navigation, timetable clarity, leave management =====
V.op={};V.dirty=false;
const crumb=a=>`<div class="crumb">${a.map(([n,h])=>h?`<a href="${h}">${esc(n)}</a>`:`<b>${esc(n)}</b>`).join(' › ')}</div>`,
tm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),mm=s=>{const[a,b]=s.split(':');return +a*60+ +b},
notFound=()=>crumb([['Home',U()?'#/dash':'#/'],['Not found']])+'<div class="card"><h2>Page not found</h2><a class="btn" href="#/">Go home</a></div>';
function toast(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',6000)}

function rmLeave(id){if(!confirm('Remove this leave record?'))return;api('DELETE','/leaves/'+id).then(m=>{setUser(m);toast('Leave removed.');route()}).catch(e=>toast(e.message))}
function cmpAdd(id){const i=V.cmp.indexOf(id);if(i>=0)V.cmp.splice(i,1);else if(V.cmp.length>=3)return toast('Compare up to 3 pathways.');else V.cmp.push(id);route()}
function compare(){const l=V.cmp.map(i=>C.find(c=>c.id==i)).filter(Boolean),rows=[['Domain','domain'],['Sector','sec'],['Category','cat'],['Minimum level',c=>EDU[c.min]],['Eligibility','el'],['Selection','sel'],['Typical preparation',c=>c.mo+' months (estimate)'],['Data status',c=>c.status]];
return crumb([['Explore','#/explore'],['Compare']])+`<h1 style="font-size:2rem">Compare pathways</h1>${l.length?`<div class="scroll"><table style="border-collapse:collapse;width:100%"><tr><th></th>${l.map(c=>`<th style="text-align:left;padding:8px"><a href="#/career/${c.id}">${esc(c.n)}</a></th>`).join('')}</tr>${rows.map(([k,f])=>`<tr><th style="text-align:left;padding:8px;vertical-align:top">${k}</th>${l.map(c=>`<td style="padding:8px;border-bottom:1px solid var(--bd)">${esc(typeof f=='function'?f(c):c[f])}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="t2">Use “Add to compare” on a career page.</p>'}<a class="btn s" href="#/explore">Back to explorer</a>`}
function admin(){const u=U();if(!u.admin)return notFound();return crumb([['Dashboard','#/dash'],['Catalogue admin']])+`<h1 style="font-size:2rem">Catalogue admin</h1><div class="card"><h3>Import pathways (JSON array or CSV)</h3><p class="t2">CSV columns: id,name,domain,sector,category,min_edu,interests (;-separated),description,eligibility,selection,months,phases (JSON),source_url,verified_on,status. If any row is invalid nothing is saved. An existing id is updated. Records marked “verified” need a source URL and verification date.</p><select id="imf" style="max-width:160px"><option value="json">JSON</option><option value="csv">CSV</option></select><textarea id="imd" rows="8"></textarea><button class="btn" onclick="doImport()">Validate & import</button><p class="t2" id="er"></p></div><div class="card" style="margin-top:16px"><h3>${C.length} pathways</h3>${C.map(c=>`<div class="t2" style="padding:4px 0">${esc(c.id)} · ${esc(c.n)} · ${esc(c.domain)} · ${c.status} · verified ${c.verified||'never'} · ${c.link?esc(c.link):'no source'} <button class="btn sm s" onclick="delCareer('${c.id}')">Delete</button></div>`).join('')}</div>`}
async function doImport(){try{const r=await api('POST','/admin/import',{format:$('#imf').value,data:$('#imd').value});await loadCareers();toast(`Imported ${r.imported} pathway(s).`);route()}catch(e){$('#er').textContent=e.message+(e.errors?' — '+e.errors.slice(0,5).map(x=>`row ${x.row}: ${x.error}`).join('; '):'')}}
async function delCareer(id){if(!confirm('Delete this pathway?'))return;try{await api('DELETE','/admin/careers/'+id);await loadCareers();route()}catch(e){toast(e.message)}}

typeof NOBOOT=='undefined'?boot():route();
</script></body></html>
